<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конвертер раскладки</title>
    <style>
        /* --- Базовые стили (без изменений, кроме доступности) --- */
        body {
            margin: 0;
            padding: 20px; /* для 1.4.4: не обрезаем при масштабировании */
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* вместо height: 100vh + overflow: hidden */
            font-family: system-ui, -apple-system, sans-serif;
            /* overflow: hidden; — УБРАНО (1.4.4) */
        }
        .container {
            text-align: center;
        }
        .input-field {
            width: 320px;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #888; /* было #333 → 1.4.11 */
            border-radius: 6px;
            background: #222;
            color: #fff;
            outline: none; /* будет переопределено ниже для :focus-visible */
            text-align: center;
            transition: border-color 0.2s;
        }

        /* 1.4.3: явный цвет placeholder с достаточным контрастом */
        .input-field::placeholder {
            color: #aaa;
            opacity: 1; /* Firefox по умолчанию снижает opacity */
        }

        /* 2.4.7: единый индикатор фокуса — только смена цвета рамки, без второго контура */
        .input-field:focus,
        .input-field:focus-visible {
            border-color: #00aaff;
        }

        .hint {
            color: #ccc; /* было #666 → 1.4.3 (контраст ≥ 4.5:1 на #111) */
            font-size: 12px;
            margin-top: 8px;
        }

        /* Зелёная подсказка об успехе */
        .hint--success {
            color: #4ade80; /* на #111 контраст ~10:1 */
        }
        .hint--success::before {
            content: "✓ ";
            font-weight: bold;
        }

        /* Стандартный класс для скрытого, но доступного текста (3.3.2) */
        .visually-hidden {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 3.3.2: программно-связанное имя поля -->
    <label for="converter" class="visually-hidden">Введите текст для конвертации раскладки</label>

    <input type="text" id="converter" class="input-field"
           placeholder="Вставьте текст сюда"
           autofocus autocomplete="off"
           aria-describedby="hint">

    <div id="hint" class="hint">Текст сконвертируется и скопируется автоматически</div>

    <!-- 4.1.3: live-регион для объявления статуса копирования -->
    <div id="status" class="visually-hidden" aria-live="polite"></div>
</div>

<script>
    const en = "qwertyuiop[]asdfghjkl;'zxcvbnm,.QWERTYUIOP{}ASDFGHJKL:\"ZXCVBNM<>`~";
    const ru = "йцукенгшщзхъфывапролджэячсмитьбюЙЦУКЕНГШЩЗХЪФЫВАПРОЛДЖЭЯЧСМИТЬБЮёЁ";

    const enToRu = {};
    const ruToEn = {};

    for (let i = 0; i < en.length; i++) {
        enToRu[en[i]] = ru[i];
        ruToEn[ru[i]] = en[i];
    }

    function convertText(text) {
        let ruCount = 0;
        let enCount = 0;

        for (let char of text) {
            if (ruToEn[char]) ruCount++;
            if (enToRu[char]) enCount++;
        }

        let result = "";
        const map = ruCount >= enCount ? ruToEn : enToRu;

        for (let char of text) {
            result += map[char] || char;
        }
        return result;
    }

    const input = document.getElementById('converter');
    const status = document.getElementById('status'); // live-регион
    const hint = document.getElementById('hint');
    const hintDefault = hint.textContent;
    let hintTimer;
    function showSuccessHint(msg) {
        hint.textContent = msg;
        hint.classList.add('hint--success');
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => {
            hint.textContent = hintDefault;
            hint.classList.remove('hint--success');
        }, 2000);
    }

    input.addEventListener('input', async (e) => {
        const original = e.target.value;
        if (!original) return;

        const converted = convertText(original);

        input.value = converted;
        input.select();

        try {
            await navigator.clipboard.writeText(converted);
            // 4.1.3: сообщаем скринридеру об успешном копировании
            status.textContent = 'Текст сконвертирован и скопирован в буфер обмена.';
            showSuccessHint('Текст сконвертирован и скопирован');
        } catch (err) {
            // Если браузер запретил запись в буфер — хотя бы сообщаем,
            // что конвертация выполнена, а текст находится в поле.
            status.textContent = 'Текст сконвертирован. Скопируйте его вручную из поля ввода.';
        }
    });

    // Очистка при клике (логика не менялась)
    input.addEventListener('click', () => {
        input.value = '';
    });
</script>

</body>
</html>
