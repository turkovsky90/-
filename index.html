<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конвертер раскладки</title>

<!-- Фавикон в адресной строке -->
<link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%23111'/%3E%3Ctext x='256' y='360' font-family='system-ui,sans-serif' font-size='240' font-weight='700' fill='%2300aaff' text-anchor='middle'%3E%D0%AFa%3C/text%3E%3C/svg%3E">

<!-- Иконка при добавлении на домашний экран iOS (перезапишется PNG из JS) -->
<link rel="apple-touch-icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%23111'/%3E%3Ctext x='256' y='360' font-family='system-ui,sans-serif' font-size='240' font-weight='700' fill='%2300aaff' text-anchor='middle'%3E%D0%AFa%3C/text%3E%3C/svg%3E">

<meta name="theme-color" content="#111111">

<!-- Манифест подставится из JS -->
<link id="pwa-manifest" rel="manifest" href="">

<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: system-ui, -apple-system, sans-serif;
    cursor: text;
    position: relative;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 900px;
    text-align: center;
  }

  .input-field {
    display: block;
    width: 100%;
    padding: 18px 16px;
    /* было clamp(1.5rem, 4vw, 3rem) — уменьшено в 1.25 раза */
    font-size: clamp(1.2rem, 3.2vw, 2.4rem);
    font-family: inherit;
    font-weight: 600;
    letter-spacing: 0.01em;
    border: none;
    border-radius: 8px;
    background: #111;
    color: #fff;
    outline: none;
    text-align: center;
    caret-color: #00aaff;
  }

  .input-field::placeholder {
    color: #444;
    opacity: 1;
  }

  .hint {
    margin-top: 18px;
    color: #bbb;
    font-size: 13px;
    transition: color 0.2s;
  }
  .hint--success { color: #4ade80; }
  .hint--success::before { content: "✓ "; font-weight: bold; }

  .visually-hidden {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }
</style>
</head>
<body>

<div class="container">
  <label for="converter" class="visually-hidden">Введите текст для конвертации раскладки</label>

  <input type="text" id="converter" class="input-field"
         placeholder="Вставьте текст сюда"
         autofocus autocomplete="off" spellcheck="false"
         aria-describedby="hint">

  <div id="hint" class="hint">Текст сконвертируется и скопируется автоматически</div>
  <div id="status" class="visually-hidden" aria-live="polite"></div>
</div>

<script>
(function () {
  /* ---------- PWA: PNG-иконки через canvas + blob-URL ---------- */
  (async function setupPwa() {
    const iconSvg =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +
        '<rect width="512" height="512" rx="96" fill="#111"/>' +
        '<text x="256" y="360" font-family="system-ui,sans-serif" ' +
              'font-size="240" font-weight="700" fill="#00aaff" ' +
              'text-anchor="middle">Яa</text>' +
      '</svg>';
    const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);

    const img = new Image();
    img.src = svgUrl;
    try { await img.decode(); } catch (e) { /* на всякий случай */ }

    function renderPngBlobUrl(size, maskable) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      if (maskable) {
        // безопасная зона maskable: контент в пределах ~80%
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, size, size);
        const pad = size * 0.1;
        ctx.drawImage(img, pad, pad, size - pad * 2, size - pad * 2);
      } else {
        ctx.drawImage(img, 0, 0, size, size);
      }
      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(URL.createObjectURL(blob)), 'image/png');
      });
    }

    function renderPngDataUrl(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      canvas.getContext('2d').drawImage(img, 0, 0, size, size);
      return canvas.toDataURL('image/png');
    }

    const [i192, i512, i512mask] = await Promise.all([
      renderPngBlobUrl(192, false),
      renderPngBlobUrl(512, false),
      renderPngBlobUrl(512, true)
    ]);
    // Держим ссылки, чтобы GC не прибил blob-URL'ы
    window.__pwaRefs = [i192, i512, i512mask];

    // iOS: apple-touch-icon должен быть PNG
    try {
      const appleLink = document.querySelector('link[rel="apple-touch-icon"]');
      if (appleLink) appleLink.href = renderPngDataUrl(180);
    } catch (e) {}

    const baseUrl = new URL('.', window.location.href).href;
    const manifest = {
      name: "Конвертер раскладки",
      short_name: "Раскладка",
      start_url: window.location.href,
      scope: baseUrl,
      display: "standalone",
      background_color: "#111111",
      theme_color: "#111111",
      icons: [
        { src: i192,     sizes: "192x192", type: "image/png", purpose: "any" },
        { src: i512,     sizes: "512x512", type: "image/png", purpose: "any" },
        { src: i512mask, sizes: "512x512", type: "image/png", purpose: "maskable" }
      ]
    };
    const manifestData =
      'data:application/manifest+json;charset=utf-8,' +
      encodeURIComponent(JSON.stringify(manifest));
    document.getElementById('pwa-manifest').href = manifestData;
  })();

  /* ---------- Логика конвертера ---------- */
  const pairs = [
    ['q','й'],['w','ц'],['e','у'],['r','к'],['t','е'],['y','н'],['u','г'],['i','ш'],['o','щ'],['p','з'],
    ['[','х'],['{','Х'],[']','ъ'],['}','Ъ'],
    ['a','ф'],['s','ы'],['d','в'],['f','а'],['g','п'],['h','р'],['j','о'],['k','л'],['l','д'],
    [';','ж'],[':','Ж'],["'",'э'],['"','Э'],
    ['z','я'],['x','ч'],['c','с'],['v','м'],['b','и'],['n','т'],['m','ь'],
    [',','б'],['<','Б'],['.','ю'],['>','Ю'],
    ['`','ё'],['~','Ё'],
    ['/','.'],['?',','],
    ['$',';'],['^',':'],['&','?'],
    ['@','"'],['#','№']
  ];

  const enToRu = Object.create(null);
  const ruToEn = Object.create(null);
  for (const [en, ru] of pairs) {
    enToRu[en] = ru;
    ruToEn[ru] = en;
    // Добавляем заглавные пары для настоящих букв (q↔й → Q↔Й и т.п.)
    const enU = en.toUpperCase();
    const ruU = ru.toUpperCase();
    if (enU !== en && ruU !== ru) {
      enToRu[enU] = ruU;
      ruToEn[ruU] = enU;
    }
  }

  function convertText(text) {
    let ru = 0, en = 0;
    for (const ch of text) {
      if (/[а-яё]/i.test(ch)) ru++;
      else if (/[a-z]/i.test(ch)) en++;
    }
    const map = ru > en ? ruToEn : enToRu;
    let out = '';
    for (const ch of text) {
      const v = map[ch];
      out += (v !== undefined ? v : ch);
    }
    return out;
  }

  const input  = document.getElementById('converter');
  const status = document.getElementById('status');
  const hint   = document.getElementById('hint');
  const hintDefault = hint.textContent;
  let hintTimer;

  function showSuccessHint(msg) {
    hint.textContent = msg;
    hint.classList.add('hint--success');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => {
      hint.textContent = hintDefault;
      hint.classList.remove('hint--success');
    }, 2000);
  }

  input.addEventListener('input', async (e) => {
    const original = e.target.value;
    if (!original) return;

    const converted = convertText(original);
    if (converted === original) return;

    input.value = converted;
    input.select();

    try {
      await navigator.clipboard.writeText(converted);
      status.textContent = 'Текст сконвертирован и скопирован в буфер обмена.';
      showSuccessHint('Текст сконвертирован и скопирован');
    } catch (err) {
      status.textContent = 'Текст сконвертирован. Скопируйте его вручную из поля ввода.';
    }
  });

  input.addEventListener('click', () => {
    input.value = '';
    input.select();
  });

  document.addEventListener('click', (e) => {
    if (e.target === input) return;
    input.focus();
  });
})();
</script>

</body>
</html>
